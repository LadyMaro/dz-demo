<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabl</title>
</head>
<body>
    <table>
        <caption>
            структура таблицы
        </caption>
        <thead>
            <tr>
                <th rowspan="2">статья</th>
                <th colspan="2">сумма</th>
            </tr>
            <tr>
                <th>руб</th>
                <th>$</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>зарплата</td>
                <td>100 000</td>
                <td>2 000</td>
            </tr>
            <tr>
                <td>сервисы</td>
                <td>30 000</td>
                <td>700</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>итог</td>
                <td>130 000</td>
                <td>2 300</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
