<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DzForm</title>
    <link rel="stylesheet" href="style/styleDZ.css">
</head>
<body>
    <header>
        <h1>Регистрация</h1>
        <p>Уже есть аккаунт?</p>
        <a href="#">Войти</a>
    </header>
    <main>
        <section>
            <h2>Моя компания</h2>
        </section>
        <section>
            <input 
                type="text"
                name="Имя"
                placeholder="Имя"
            />
            <input 
                type="text"
                name="Фамилия"
                placeholder="Фамилия"
            />
        </section>
        <section>
            <input 
                type="email"
                name="email"
                placeholder="E-mail"
            />
        </section>
        <section>
            <button>Зарегистрироваться &#8594;</button>
        </section>
    </main>
    <footer>
        <label for="agree">Я прочитал и принимаю</label>
        <input 
            type="checkbox"
            name="agree"
            id="agree"
        />
        <a href="##">Условия использования</a>
    </footer>
</body>
</html>
