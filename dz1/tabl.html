<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document tabl</title>
</head>
<body>
    <table>
        <caption>Прайс-лист товаров</caption>

            <tr>
                <th scope="col">Товар</th>
                <th scope="col">Цена</th>
                <th scope="col">Валюта</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Хлеб</td>
                <td>50</td>
                <td>руб</td>
            </tr>
            <tr>
                <td>Молоко</td>
                <td>80</td>
                <td>руб</td>
            </tr>
            <tr>
                <td>Яйца</td>
                <td>120</td>
                <td>руб</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
